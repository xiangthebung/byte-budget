<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="welcomePageTitle"></title>
  </head>
  <!--
    Every string on this page is named here and written in by `welcome.ts`. Chrome
    substitutes `__MSG_name__` in the manifest and in CSS but not in an extension page's
    HTML, so there is no declarative way to do it, and copy left in the markup would be
    copy a translation never reaches. `data-i18n-label`, `data-i18n-title` and
    `data-i18n-placeholder` cover the attributes, which are the strings an extraction
    pass forgets and the whole of the page for a screen-reader user.
  -->
  <body>
    <div class="page welcome-page">
      <header class="page-head">
        <div class="brand">
          <img class="brand-mark" src="./icon.svg" alt="" width="40" height="40" />
          <div class="brand-copy">
            <p class="brand-eyebrow">Byte Budget</p>
            <h1 class="brand-title" data-i18n="welcomeTitle"></h1>
            <p class="brand-sub" data-i18n="welcomeIntro"></p>
          </div>
        </div>
      </header>

      <main class="settings-stack">
        <section class="panel feature-panel" id="plan-panel" aria-labelledby="plan-title">
          <!--
            The heading names the whole question rather than leaning on a kicker above
            it: `aria-labelledby` points here, so this string is what a screen reader
            announces on entering the region, with none of the surrounding page for
            context.
          -->
          <div class="panel-head">
            <h2 class="feature-title" id="plan-title" data-i18n="welcomePlanTitle"></h2>
          </div>

          <form class="welcome-form" id="plan-form">
            <div class="field">
              <label class="field-label" for="plan-size" data-i18n="welcomePlanSizeLabel"></label>
              <input
                class="search-input"
                id="plan-size"
                type="text"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="welcomePlanSizePlaceholder"
                list="plan-sizes"
                aria-describedby="plan-size-hint"
              />
              <!--
                The suggestions are values, not labels: picking one puts the text straight
                into the field, where `parseByteSize` has to read it back. Translating them
                would be translating input, so they stay as they are.
              -->
              <datalist id="plan-sizes">
                <option value="5 GB"></option>
                <option value="10 GB"></option>
                <option value="15 GB"></option>
                <option value="30 GB"></option>
                <option value="50 GB"></option>
              </datalist>
              <p class="field-hint" id="plan-size-hint" aria-live="polite"></p>
            </div>

            <div class="field">
              <label class="field-label" for="cycle-day" data-i18n="welcomeCycleDayLabel"></label>
              <!--
                Filled by `welcome.ts` rather than written out here: twenty-eight options
                is a lot of markup to keep in step with `MAX_CYCLE_START_DAY`, and the
                ceiling is the whole point of the control.
              -->
              <select class="select" id="cycle-day" aria-describedby="cycle-day-hint"></select>
              <p class="field-hint" id="cycle-day-hint" aria-live="polite"></p>
            </div>

            <div class="welcome-actions">
              <button
                class="primary-button"
                id="plan-save"
                type="submit"
                data-i18n="welcomePlanSave"
              ></button>
              <button
                class="ghost-button"
                id="plan-skip"
                type="button"
                data-i18n="welcomeSkip"
              ></button>
            </div>
          </form>

          <p class="field-hint form-status" id="plan-status" aria-live="polite"></p>

          <details class="inline-details">
            <summary data-i18n="welcomePlanDetailsSummary"></summary>
            <p data-i18n="welcomePlanDetailsAllowance"></p>
            <p data-i18n="welcomePlanDetailsEnforcement"></p>
            <p data-i18n="welcomePlanDetailsResetDay"></p>
          </details>
        </section>

        <section class="panel feature-panel saver-panel" id="saver-panel" aria-labelledby="saver-title">
          <div class="setting-hero">
            <div class="setting-hero-copy">
              <p class="panel-kicker" data-i18n="welcomeSaverKicker"></p>
              <h2 class="feature-title" id="saver-title" data-i18n="welcomeSaverTitle"></h2>
              <p class="section-intro" data-i18n="welcomeSaverIntro"></p>
              <p class="section-intro" data-i18n="welcomeSaverControl"></p>
            </div>
            <label class="switch-control">
              <input type="checkbox" id="saver-toggle" />
              <span class="switch-track" aria-hidden="true"><span></span></span>
              <span class="switch-label" data-i18n="welcomeSaverSwitchLabel"></span>
            </label>
          </div>
          <p class="save-status" id="saver-status" aria-live="polite"></p>
        </section>

        <section class="panel" id="scope-panel" aria-labelledby="scope-title">
          <h2 class="panel-title" id="scope-title" data-i18n="welcomeScopeTitle"></h2>
          <p class="section-intro" data-i18n="welcomeScopeBody"></p>
        </section>
      </main>

      <nav class="section-nav" data-i18n-label="welcomeNavLabel">
        <a href="./dashboard.html" data-i18n="welcomeNavDashboard"></a>
        <a href="./settings.html" data-i18n="welcomeNavSettings"></a>
      </nav>
    </div>
    <script type="module" src="./welcome.ts"></script>
  </body>
</html>
