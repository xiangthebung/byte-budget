<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byte Budget</title>
  </head>
  <!--
    Every fixed element on this surface is written here rather than built in script.

    Their text is not: a `data-i18n` attribute names a message and `popup.ts` writes it
    in before anything else runs. Chrome substitutes `__MSG_name__` in the manifest and
    in CSS but not in an extension page's HTML, so there is no declarative way to do it,
    and an element left holding English here would be the one string a translation never
    reaches. `data-i18n-title` and `data-i18n-label` cover `title` and `aria-label`,
    which are the whole of this surface for a screen-reader user.

    The popup polls every two seconds, and the old code answered each poll by calling
    `replaceChildren` over three whole subtrees. A keyboard user had under two seconds
    to reach "Pause 1 hour" before the button was destroyed and focus fell to <body>,
    and a screen reader's buffer was wiped mid-sentence on the same clock. Nodes that
    exist in the markup cannot be destroyed by a re-render: the render path only writes
    textContent, style, dataset and `hidden`, so focus and the virtual buffer survive.
    The three genuinely variable things — the bar chart, the type breakdown and the
    site list — are the only things script creates, and the site list is reconciled by
    key rather than rebuilt.
  -->
  <body>
    <div class="app" id="app" data-state="loading">
      <header class="topbar">
        <div class="headline">
          <h1 class="sr-only">Byte Budget</h1>
          <p class="pace-line" id="pace-line"></p>
          <p class="headline-total">
            <span class="headline-value" id="total-value">–</span>
            <span class="headline-unit" id="total-unit"></span>
          </p>
        </div>
        <div class="topbar-actions">
          <button
            class="icon-button"
            id="dashboard-button"
            type="button"
            data-i18n-label="popupOpenDashboard"
            data-i18n-title="popupOpenDashboard"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 19V9m5 10V5m5 14v-7m5 7V8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            class="icon-button"
            id="settings-button"
            type="button"
            data-i18n-label="popupOpenSettings"
            data-i18n-title="popupOpenSettings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9" />
              <path
                d="M12 2.9v2.3M12 18.8v2.3M2.9 12h2.3M18.8 12h2.3M6.1 6.1l1.6 1.6M16.3 16.3l1.6 1.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <!--
        The plan meter. `aria-valuetext` carries the sentence rather than the raw
        percentage: "132" read on its own is not the fact, "1.1 MB of 800 kB, 132% of
        your plan" is.
      -->
      <div class="plan" id="plan-block" hidden>
        <span
          class="plan-meter"
          id="plan-meter"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          data-i18n-label="popupPlanMeterLabel"
        >
          <span class="plan-meter-fill" id="plan-meter-fill"></span>
          <span class="plan-meter-pace" id="plan-meter-pace" aria-hidden="true"></span>
        </span>
        <p class="plan-line" id="plan-line"></p>
      </div>

      <p class="plan-cta" id="plan-cta" hidden>
        <span class="plan-cta-copy" data-i18n="popupPlanCtaCopy"></span>
        <button
          class="ghost-button"
          id="plan-cta-button"
          type="button"
          data-i18n="popupPlanCtaButton"
        ></button>
      </p>

      <!--
        Shown only when a plan size is recorded and no limit over everything exists to
        check it against. `settings.planBytes` on its own produces no alert, ever: an
        alert is computed from an allowance the governor tracks, so a plan with no
        `#all` budget behind it is a number that watches nothing.
      -->
      <section class="plan-alerts" id="plan-alerts" hidden aria-labelledby="plan-alerts-title">
        <span class="plan-alerts-copy">
          <span
            class="plan-alerts-title"
            id="plan-alerts-title"
            data-i18n="popupPlanAlertsTitle"
          ></span>
          <span class="plan-alerts-hint" id="plan-alerts-hint"></span>
        </span>
        <button
          class="ghost-button"
          id="plan-alerts-button"
          type="button"
          data-i18n="popupPlanAlertsButton"
        ></button>
      </section>

      <section class="projection" id="projection" hidden aria-labelledby="projection-heading">
        <h2
          class="projection-heading"
          id="projection-heading"
          data-i18n="popupProjectionHeading"
        ></h2>
        <p class="projection-figure" id="projection-figure" hidden></p>
        <!--
          The basis sentence is composed in the worker by `core/forecast.ts` and arrives
          as data, so it is written from the payload rather than from a message here.
        -->
        <p class="projection-basis" id="projection-basis"></p>
        <button
          class="link-button"
          id="projection-toggle"
          type="button"
          aria-expanded="false"
          data-i18n="popupProjectionShow"
        ></button>
      </section>

      <div class="tabs" id="period-tabs" data-i18n-label="popupPeriodLabel"></div>

      <p class="meta-line" id="meta-line"></p>

      <!--
        Its own persistent element, not the footer note. A failed action used to be
        written into 10px right-aligned grey and erased by the next two-second poll, so
        "Could not change the limit" could come and go before it was read.
      -->
      <p class="action-error" id="action-error" role="alert" hidden>
        <span class="action-error-text" id="action-error-text"></span>
        <button
          class="link-button"
          id="action-error-dismiss"
          type="button"
          data-i18n="popupErrorDismiss"
        ></button>
      </p>

      <section class="limit" id="limit-card" hidden aria-labelledby="limit-heading">
        <div class="limit-head">
          <h2 class="limit-heading" id="limit-heading" data-i18n="popupLimitHeading"></h2>
          <span class="limit-scope" id="limit-scope"></span>
        </div>
        <p class="limit-status" id="limit-status" hidden></p>
        <p class="limit-line" id="limit-line" hidden></p>
        <span class="limit-bar" id="limit-bar" hidden aria-hidden="true">
          <span class="limit-bar-fill" id="limit-bar-fill"></span>
        </span>
        <p class="limit-consequence" id="limit-consequence" hidden></p>
        <p class="limit-prevented" id="limit-prevented" hidden></p>
        <p class="limit-also" id="limit-also" hidden></p>
        <p class="limit-note" id="limit-note" hidden></p>
        <div class="limit-actions" id="limit-actions" hidden>
          <button class="ghost-button" id="limit-grant" type="button"></button>
          <button class="ghost-button" id="limit-pause" type="button"></button>
          <button
            class="ghost-button"
            id="limit-remove"
            type="button"
            data-i18n="popupLimitRemove"
          ></button>
        </div>
        <div class="limit-actions" id="limit-presets" hidden></div>
        <button
          class="link-button"
          id="limit-more"
          type="button"
          data-i18n="popupLimitMore"
        ></button>
      </section>

      <!--
        Below the limit card, and suppressed while a limit is biting. It used to sit
        directly above "1.1 MB of 800 kB · 132%", pitching an optimizer at someone
        whose page was already being cut off by enforcement they had set themselves.
      -->
      <section class="optimize-row" id="optimize-row" hidden>
        <input class="optimize-check" type="checkbox" id="optimize-site" hidden />
        <label class="optimize-copy" id="optimize-copy">
          <span class="optimize-title" id="optimize-title"></span>
          <span class="optimize-hint" id="optimize-hint"></span>
          <span class="optimize-measured" id="optimize-measured" hidden></span>
        </label>
        <span class="optimize-actions">
          <button class="ghost-button" id="optimize-action" type="button"></button>
          <button
            class="icon-button optimize-dismiss"
            id="optimize-dismiss"
            type="button"
            data-i18n-label="popupOptimizeDismissLabel"
            data-i18n-title="popupOptimizeDismissTitle"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M6 6l12 12M18 6L6 18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </span>
      </section>

      <section class="panel" id="chart-panel" aria-labelledby="chart-title">
        <div class="panel-head">
          <h2 class="panel-title" id="chart-title" data-i18n="popupChartTitle"></h2>
          <span class="panel-note" id="chart-note"></span>
        </div>
        <div class="chart-slot" id="chart-slot"></div>
        <div class="types-slot" id="types-slot"></div>
      </section>

      <main class="panel" id="sites-panel" aria-labelledby="sites-title">
        <div class="panel-head">
          <h2 class="panel-title" id="sites-title" data-i18n="popupSitesTitle"></h2>
          <span class="panel-note" id="sites-note"></span>
        </div>
        <ol class="site-list" id="site-list"></ol>
        <button class="link-button" id="sites-expand" type="button" hidden></button>
      </main>

      <p class="empty" id="empty-state" hidden></p>

      <footer class="footer">
        <span class="footer-note" id="footer-note" data-i18n="popupFooterNote"></span>
      </footer>

      <p class="live-region" id="live-region" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
