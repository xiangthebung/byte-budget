<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No prose in this file, only `data-i18n*` attributes naming a message.

      Chrome expands `__MSG_name__` in the manifest and in CSS but not in an
      extension's HTML, so English left inline here would be a second copy of every
      string in `i18n/dashboard.json` with nothing keeping the two in step. The pass
      at the top of `dashboard.ts` fills them before the first render, which also
      means a key that was renamed shows as the key rather than as stale English.
    -->
    <title data-i18n="dashboardPageTitle"></title>
  </head>
  <body>
    <div class="page dashboard-page">
      <header class="page-head">
        <div class="brand">
          <img class="brand-mark" src="./icon.svg" alt="" width="40" height="40" />
          <div class="brand-copy">
            <p class="brand-eyebrow" data-i18n="dashboardBrandEyebrow"></p>
            <h1 class="brand-title" data-i18n="dashboardBrandTitle"></h1>
            <p class="brand-sub" id="period-description" data-i18n="dashboardLoading"></p>
            <!-- Shown only once the payload on screen is older than the poll can
                 explain; `dashboard.ts` owns the threshold. -->
            <p class="brand-stale" id="updated-note" hidden></p>
          </div>
        </div>
        <!--
          No `role="tablist"` on either of the two segmented controls here. Neither
          owns a tabpanel — choosing a period re-renders the whole surface — and the
          role promises a keyboard contract that the hand-wired version never had.
          `bindGroup` in core/dom.ts makes both real radio groups at startup.
        -->
        <div
          class="segmented"
          data-i18n-aria-label="dashboardPeriodGroupLabel"
          id="period-tabs"
        ></div>
      </header>

      <nav class="section-nav" data-i18n-aria-label="dashboardNavLabel">
        <a href="./dashboard.html" aria-current="page" data-i18n="dashboardNavDashboard"></a>
        <a href="./settings.html" data-i18n="dashboardNavSettings"></a>
      </nav>

      <main class="page-main">
        <section id="overview" data-i18n-aria-label="dashboardOverviewLabel">
          <div class="stats" id="stats"></div>
          <!--
            The projection's basis, in full and in prose.

            It is the one modelled figure on the overview payload, and `forecast.ts`
            makes `basis` a required field precisely so it cannot reach a screen
            without saying what rate it assumed and over what window. It sits here
            rather than inside the card because it is three clauses long, and a 265px
            tile is not where a sentence that names a rate and a window belongs.
          -->
          <p class="basis-note" id="projection-basis" hidden></p>
        </section>

        <section class="panel" aria-labelledby="sites-title">
          <div class="panel-head">
            <h2 class="panel-title" id="sites-title" data-i18n="dashboardSitesTitle"></h2>
            <div class="panel-tools">
              <!-- One message for both: an accessible name that has drifted from the
                   placeholder beside it describes a different control. -->
              <input
                class="search-input"
                id="site-search"
                type="search"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="dashboardSiteSearchLabel"
                data-i18n-aria-label="dashboardSiteSearchLabel"
              />
              <span class="panel-note" id="sites-note"></span>
            </div>
          </div>
          <ol class="site-list" id="site-list"></ol>
          <p class="empty" id="sites-empty" data-i18n="dashboardSitesEmpty" hidden></p>
        </section>

        <!--
          `tabindex="-1"` so opening can move focus into the panel and closing can put
          it back on the row. Without it, hiding the panel while focus is inside drops
          the user to <body> at the top of the document with no route back.
        -->
        <section
          class="panel"
          id="detail-panel"
          hidden
          tabindex="-1"
          aria-labelledby="detail-title"
        >
          <div class="panel-head">
            <h2 class="panel-title" id="detail-title" data-i18n="dashboardDetailTitle"></h2>
            <button
              class="ghost-button"
              id="detail-close"
              type="button"
              data-i18n="dashboardDetailClose"
            ></button>
          </div>
          <div class="detail-headline">
            <img class="site-icon" id="detail-icon" alt="" width="28" height="28" />
            <div class="detail-copy">
              <p class="detail-site" id="detail-site"></p>
              <p class="detail-sub" id="detail-sub"></p>
            </div>
          </div>

          <!--
            Acting on a heavy site where it was spotted. Everything below sends the
            same messages the popup and Settings send; noticing a site here and having
            to retype its hostname into another page was the whole defect.
          -->
          <div class="detail-actions">
            <div class="detail-action" id="detail-limit-block">
              <h3 class="detail-heading" data-i18n="dashboardDetailLimitHeading"></h3>
              <div id="detail-limit-status"></div>
              <div class="detail-controls" id="detail-limit-controls">
                <div class="detail-control">
                  <span
                    class="field-label"
                    id="detail-period-label"
                    data-i18n="dashboardDetailWindowLabel"
                  ></span>
                  <div
                    class="segmented"
                    id="detail-period"
                    aria-labelledby="detail-period-label"
                  ></div>
                </div>
                <div class="detail-control">
                  <span
                    class="field-label"
                    id="detail-shape-label"
                    data-i18n="dashboardDetailShapeLabel"
                  ></span>
                  <div
                    class="segmented"
                    id="detail-shape"
                    aria-labelledby="detail-shape-label"
                  ></div>
                </div>
              </div>
              <div class="detail-presets" id="detail-presets"></div>
              <p class="field-hint" id="detail-limit-hint"></p>
            </div>

            <div class="detail-action">
              <h3 class="detail-heading" data-i18n="dashboardDetailSaverHeading"></h3>
              <div id="detail-saver"></div>
              <p class="field-hint" id="detail-advice" hidden></p>
            </div>
          </div>

          <div class="detail-grid">
            <div class="detail-block">
              <h3 class="detail-heading" data-i18n="dashboardDetailHoursHeading"></h3>
              <div id="detail-hours"></div>
            </div>
            <div class="detail-block">
              <h3 class="detail-heading" data-i18n="dashboardDetailDaysHeading"></h3>
              <div id="detail-days"></div>
            </div>
            <div class="detail-block">
              <h3 class="detail-heading" data-i18n="dashboardTypeOfData"></h3>
              <div id="detail-types"></div>
            </div>
            <div class="detail-block">
              <h3 class="detail-heading" data-i18n="dashboardDetailHostsHeading"></h3>
              <!-- Filled by `renderLocks()` on a free install; empty otherwise. -->
              <div class="plus-lock-slot" id="detail-hosts-lock"></div>
              <table class="table" id="detail-hosts">
                <thead>
                  <tr>
                    <th scope="col" data-i18n="dashboardHostsColumnHost"></th>
                    <th scope="col" class="numeric" data-i18n="dashboardHostsColumnData"></th>
                    <th scope="col" class="numeric" data-i18n="dashboardHostsColumnRequests"></th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
              <p class="empty" id="detail-hosts-empty" hidden></p>
            </div>
          </div>
        </section>

        <div class="columns">
          <section class="panel dashboard-chart" aria-labelledby="trend-title">
            <div class="panel-head">
              <h2 class="panel-title" id="trend-title" data-i18n="dashboardTrendTitle"></h2>
              <!-- The label names both panels this control scopes: it also re-scopes
                   the Data Saver results several hundred pixels further down. -->
              <div
                class="segmented"
                data-i18n-aria-label="dashboardRangeGroupLabel"
                id="range-tabs"
              ></div>
            </div>
            <div id="trend-slot"></div>
          </section>

          <section class="panel" aria-labelledby="types-title">
            <div class="panel-head">
              <h2 class="panel-title" id="types-title" data-i18n="dashboardTypeOfData"></h2>
              <span class="panel-note" id="types-note"></span>
            </div>
            <div id="types-slot"></div>
          </section>
        </div>

        <details class="method-details">
          <summary data-i18n="dashboardMethodSummary"></summary>
          <p data-i18n="dashboardMethodBodyOne"></p>
          <p data-i18n="dashboardMethodBodyTwo"></p>
          <p data-i18n="dashboardMethodBodyThree"></p>
        </details>

        <section class="panel" id="savings-panel" aria-labelledby="savings-title">
          <div class="panel-head">
            <h2 class="panel-title" id="savings-title" data-i18n="dashboardSavingsTitle"></h2>
            <div class="panel-tools">
              <span class="panel-note" id="savings-note"></span>
              <button
                class="ghost-button"
                id="savings-range"
                type="button"
                data-i18n="dashboardSavingsRangeButton"
              ></button>
              <a
                class="panel-link"
                href="./settings.html#saver"
                data-i18n="dashboardManageSaverLink"
              ></a>
            </div>
          </div>
          <!--
            Two tiles, never one. `saved` is a measured subtraction added to a model's
            guess, and a surface that renders only the sum has merged them — the one
            thing README.md:133-141 says must never happen.
          -->
          <div class="stats" id="savings-stats"></div>
          <p class="field-hint" id="savings-hint"></p>

          <!--
            Stands in for everything below it while Data Saver has never run. The
            methodology under this panel is worth its length once there are numbers to
            defend; in front of a fresh install it is four paragraphs of statistics
            about nothing, and it was the tallest thing on an empty dashboard.
          -->
          <p class="empty" id="savings-idle" hidden></p>

          <div class="savings-compare" id="savings-compare">
            <h3 class="detail-heading" data-i18n="dashboardSavingsCompareHeading"></h3>
            <div class="plus-lock-slot" id="savings-compare-lock"></div>
            <p class="field-hint" id="savings-compare-note"></p>
            <div class="table-scroll">
              <table class="table" id="savings-table">
                <thead>
                  <tr>
                    <th scope="col" data-i18n="dashboardSavingsColumnSite"></th>
                    <th scope="col" class="numeric" data-i18n="dashboardSavingsColumnWith"></th>
                    <th scope="col" class="numeric" data-i18n="dashboardSavingsColumnWithout"></th>
                    <th
                      scope="col"
                      class="numeric"
                      data-i18n="dashboardSavingsColumnSavedPerLoad"
                    ></th>
                    <th scope="col" class="numeric" data-i18n="dashboardSavingsColumnLoads"></th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
            <p class="empty" id="savings-empty" hidden></p>
          </div>

          <details class="inline-details savings-details" id="savings-details">
            <summary data-i18n="dashboardSavingsDetailsSummary"></summary>
            <p class="field-hint" id="savings-explainer"></p>
          </details>
        </section>

        <div class="bottom-grid">
          <section class="panel" id="plan-panel" aria-labelledby="plan-title">
            <div class="panel-head">
              <h2 class="panel-title" id="plan-title" data-i18n="dashboardPlanTitle"></h2>
              <span class="panel-note" id="plan-note"></span>
            </div>
            <div id="plan-body"></div>
          </section>

          <section class="panel" id="storage-panel" aria-labelledby="storage-title">
            <div class="panel-head">
              <h2 class="panel-title" id="storage-title" data-i18n="dashboardStorageTitle"></h2>
              <a
                class="panel-link"
                href="./settings.html#privacy"
                data-i18n="dashboardStorageLink"
              ></a>
            </div>
            <div id="storage-body"></div>
          </section>
        </div>
      </main>

      <p class="live-region" id="live-region" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="./dashboard.ts"></script>
  </body>
</html>
